<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 SKILLS TEST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2b26c7 0%, #4b3fe2 50%, #2b26c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 720px;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .card-header-custom {
            background-color: #0d6efd;
            color: #ffffff;
            text-align: center;
            padding: 28px 20px;
        }

        .card-header-custom h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-header-custom p {
            font-size: 0.9rem;
            margin: 0;
            opacity: 0.95;
        }

        .card-body-custom {
            padding: 24px 28px;
        }

        .instructions-box {
            background-color: #d2f4fa;
            border: 1px solid #a6e9f5;
            color: #084258;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.88rem;
            margin-bottom: 20px;
        }

        .instructions-box strong {
            display: block;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .input-label {
            font-weight: 600;
            font-size: 0.92rem;
            color: #212529;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-control-custom {
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #ced4da;
            margin-bottom: 16px;
        }

        .form-control-custom:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .btn-check-details {
            background-color: #198754;
            color: #ffffff;
            font-weight: 500;
            font-size: 1rem;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .btn-check-details:hover {
            background-color: #157347;
            color: #ffffff;
        }

        .divider {
            margin: 22px 0 18px 0;
            border-top: 1px solid #dee2e6;
        }

        .result-heading {
            color: #0d6efd;
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .result-box {
            background-color: #f4f5f7;
            border-left: 5px solid #0d6efd;
            border-radius: 6px;
            padding: 16px 18px;
            font-size: 0.92rem;
            line-height: 1.7;
            color: #212529;
            min-height: 95px;
        }

        .card-footer-custom {
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
            text-align: center;
            padding: 12px 20px;
            font-size: 0.8rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="card-header-custom">
            <h1>Non-Metal Elements</h1>
            <p>Periodic Table Information Finder</p>
        </div>

        <div class="card-body-custom">
            <div class="instructions-box">
                <strong>Instructions:</strong>
                Enter the <b>symbol</b> of a non-metal element (Example: H, O, Cl, Ne, Xe).
            </div>

            <label for="elementInput" class="input-label">
                <i class="bi bi-search"></i> Element Symbol
            </label>
            <input type="text" id="elementInput" class="form-control form-control-custom" placeholder="e.g., H, O, Rn">

            <button type="button" class="btn btn-check-details" py-click="find_element">
                Check Details
            </button>

            <hr class="divider">

            <div class="result-heading">
                <i class="bi bi-card-list"></i> Result
            </div>
            <div id="result" class="result-box">
                <span class="text-muted">Element details will appear here...</span>
            </div>
        </div>

        <div class="card-footer-custom">
            Skills Test &bull; 2nd Quarter 
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
